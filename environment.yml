name: deepcad

channels:
  - conda-forge

dependencies:
  - python=3.9
  - pythonocc-core=7.9.0
  - pip
  - numpy=1.23.5
  - scipy
  - pandas
  - h5py
  - trimesh
  - matplotlib
  - tqdm
  - scikit-learn
  - joblib
  - tensorboardX
  - plyfile
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.8.0
